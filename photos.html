<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photos , Tar Heel Raas</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: 48px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .photo-item img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }

    .photo-year-label {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--navy);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <img src="actualpics/UNCTarHeelRaas_TeamLogo.png" alt="Tar Heel Raas Logo" style="height:46px;width:auto;" />
      <span class="nav-logo-text">Tar Heel Raas</span>
    </a>
        <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="involved.html">Get Involved</a></li>
      <li><a href="competitions.html">Competitions & Events</a></li>
      <li><a href="photos.html" class="active">Photos</a></li>
    </ul>
  </nav>

  <div class="page-hero" style="background:#fff">
    <h1>Team Photos</h1>
  </div>

  <div class="section">
    <div class="section-label">Through the Years</div>

    <div class="photo-grid">

      <div class="photo-item">
        <img src="actualpics/DSC09272.jpg" alt="2025-26 team" />
        <div class="photo-year-label">2025–2026</div>
      </div>

      <div class="photo-item">
        <img src="actualpics/2425raas.png" alt="2024-25 team" />
        <div class="photo-year-label">2024–2025</div>
      </div>


      <div class="photo-item">
        <img src="actualpics/2022-23.jpg" alt="2022-23 team" />
        <div class="photo-year-label">2022–2023</div>
      </div>

      <div class="photo-item">
        <img src="actualpics/2020-21.jpg" alt="2020-21 team" />
        <div class="photo-year-label">2020–2021</div>
      </div>

      <div class="photo-item">
        <img src="actualpics/2019-20.JPG" alt="2019-20 team" />
        <div class="photo-year-label">2019–2020</div>
      </div>

      <div class="photo-item">
        <img src="actualpics/2018-19.jpg" alt="2018-19 team" />
        <div class="photo-year-label">2018–2019</div>
      </div>

      <div class="photo-item">
        <img src="actualpics/2016-17.jpg" alt="2016-17 team" />
        <div class="photo-year-label">2016–2017</div>
      </div>

    </div>
  </div>

  <footer>
    <div class="footer-logo">
      <img src="actualpics/UNCTarHeelRaas_TeamLogo.png" alt="Tar Heel Raas Logo" style="height:38px;width:auto;" />
      <span class="footer-logo-text">Tar Heel Raas</span>
    </div>
    <div class="footer-copy">© 2026 Tar Heel Raas · UNC Chapel Hill</div>
  </footer>

</body>
</html>
