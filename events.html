<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events — Tar Heel Raas</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .event-list { margin-top: 40px; border-top: 1px solid var(--border); }

    .event-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 28px;
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .event-item:hover { background: rgba(75, 156, 211, 0.03); }
    .event-name { font-size: 19px; font-weight: 500; color: var(--navy); }

    .event-tag {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 2px;
      font-weight: 500;
      white-space: nowrap;
    }

    .tag-event { background: rgba(75, 156, 211, 0.12); color: #0d4a7a; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <img src="actualpics/UNCTarHeelRaas_TeamLogo.png" alt="Tar Heel Raas Logo" style="height:46px;width:auto;" />
      <span class="nav-logo-text">Tar Heel Raas</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="involved.html">Get Involved</a></li>
      <li><a href="events.html" class="active">Events</a></li>
      <li><a href="competitions.html">Competitions</a></li>
      <li><a href="photos.html">Photos</a></li>
    </ul>
  </nav>

  <div class="page-hero">
    <h1>Events & Videos</h1>
  </div>

  <div class="section">
    <div class="section-label">Coming Up</div>
    <h2>Upcoming Events</h2>
    <div class="event-list">
      <div class="event-item">
        <div class="event-name">Insert event here</div>
        <span class="event-tag tag-event">Event</span>
      </div>
    </div>
  </div>

  <hr class="divider" />

  <div class="section-alt">
    <div class="section-label">Look Back</div>
    <h2>Recent Performances</h2>
    <div class="event-list">
      <div class="event-item">
        <div class="event-name">Holi Moli</div>
        <span class="event-tag tag-event">Performance</span>
      </div>
      <div class="event-item">
        <div class="event-name">Bhangra Sutra</div>
        <span class="event-tag tag-event">Performance</span>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-logo">
      <img src="actualpics/UNCTarHeelRaas_TeamLogo.png" alt="Tar Heel Raas Logo" style="height:38px;width:auto;" />
      <span class="footer-logo-text">Tar Heel Raas</span>
    </div>
    <div class="footer-copy">© 2026 Tar Heel Raas · UNC Chapel Hill</div>
  </footer>

</body>
</html>
